<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850" role="img" aria-labelledby="title desc">
  <title id="title">GhostLab whole-agent optimization — simplified</title>
  <desc id="desc">Simplified architecture. GhostLab reads the technique registry, control agent, replay sessions, and campaign budget; constructs legal Adaptive Hybrid candidates; replays each candidate against the same control; computes paired rewards; promotes, rejects, or holds candidates across F0, F1, BOHB, and F2; then packages the selected specification, evidence, rejections, and campaign report for human review.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12233d"/>
    </linearGradient>
    <linearGradient id="violetPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241f4d"/>
      <stop offset="1" stop-color="#171a39"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d47"/>
      <stop offset="1" stop-color="#102238"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9fb3ca"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#55b7ff"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#45d6c0"/>
    </marker>
    <style>
      .title { font: 700 40px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; letter-spacing: -0.6px; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #adbed1; }
      .section { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .node-title { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #9fb3ca; }
      .pill { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.75px; }
      .edge-label { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d8e4f0; paint-order: stroke; stroke: #1a1b3d; stroke-width: 7px; stroke-linejoin: round; }
      .edge-label-top { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d8e4f0; paint-order: stroke; stroke: #0b1728; stroke-width: 7px; stroke-linejoin: round; }
      .edge-label-blue { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #8bd3ff; paint-order: stroke; stroke: #102238; stroke-width: 7px; stroke-linejoin: round; }
      .edge-label-violet { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #c4b5fd; paint-order: stroke; stroke: #1a1b3d; stroke-width: 7px; stroke-linejoin: round; }
      .edge-label-teal { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #79ead9; paint-order: stroke; stroke: #1a1b3d; stroke-width: 7px; stroke-linejoin: round; }
      .input { fill: #17263a; stroke: #415871; stroke-width: 1.5; }
      .node-blue { fill: #123651; stroke: #419ee0; stroke-width: 1.5; }
      .node-violet { fill: #2a2353; stroke: #8268dc; stroke-width: 1.5; }
      .node-amber { fill: #3a2a17; stroke: #d7a13a; stroke-width: 1.5; }
      .node-teal { fill: #103a3b; stroke: #31bbaa; stroke-width: 1.5; }
      .flow { fill: none; stroke: #9fb3ca; stroke-width: 2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #55b7ff; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .flow-violet { fill: none; stroke: #a78bfa; stroke-width: 2.2; marker-end: url(#arrowViolet); }
      .flow-teal { fill: none; stroke: #45d6c0; stroke-width: 2.2; marker-end: url(#arrowTeal); }
      .feedback { fill: none; stroke: #a78bfa; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrowViolet); }
      .boundary { fill: none; stroke: #d7a13a; stroke-width: 1.6; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1800" height="850" fill="url(#background)"/>
  <circle cx="1680" cy="50" r="250" fill="#4f46e5" opacity="0.07"/>
  <circle cx="80" cy="830" r="240" fill="#14b8a6" opacity="0.055"/>

  <text x="60" y="58" class="title">GhostLab whole-agent optimization — simplified</text>
  <text x="60" y="92" class="subtitle">Construct valid Adaptive Hybrid candidates, compare complete agents fairly, and select a winner using offline evidence.</text>
  <rect x="1460" y="40" width="280" height="40" rx="20" fill="#352b65" stroke="#8d76e8"/>
  <text x="1503" y="65" class="pill" fill="#ddd6fe">OFFLINE SEARCH ONLY</text>

  <text x="60" y="137" class="section">Main inputs</text>
  <g filter="url(#shadow)">
    <rect x="60" y="157" width="390" height="75" rx="15" class="input"/>
    <text x="255" y="190" text-anchor="middle" class="node-title">Technique registry</text>
    <text x="255" y="213" text-anchor="middle" class="small">Supplies legal building blocks</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="480" y="157" width="390" height="75" rx="15" class="input"/>
    <text x="675" y="190" text-anchor="middle" class="node-title">Current adaptive control</text>
    <text x="675" y="213" text-anchor="middle" class="small">Provides the comparison baseline</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="157" width="390" height="75" rx="15" class="input"/>
    <text x="1095" y="190" text-anchor="middle" class="node-title">Development replay sessions</text>
    <text x="1095" y="213" text-anchor="middle" class="small">Supply the same evaluation cases</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1320" y="157" width="420" height="75" rx="15" class="input"/>
    <text x="1530" y="190" text-anchor="middle" class="node-title">Campaign budgets and seed</text>
    <text x="1530" y="213" text-anchor="middle" class="small">Bound cost + make search repeatable</text>
  </g>

  <!-- Three main planes -->
  <rect x="45" y="280" width="500" height="360" rx="24" fill="url(#violetPanel)" stroke="#725dcc" stroke-width="1.7"/>
  <text x="75" y="320" class="section">1. Construct candidates</text>
  <g filter="url(#shadow)">
    <rect x="75" y="360" width="440" height="65" rx="15" class="node-violet"/>
    <text x="295" y="399" text-anchor="middle" class="node-title">Select legal technique combinations</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="75" y="455" width="440" height="65" rx="15" class="node-violet"/>
    <text x="295" y="494" text-anchor="middle" class="node-title">Build CandidateSpec + parameters</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="75" y="550" width="440" height="65" rx="15" class="node-amber"/>
    <text x="295" y="589" text-anchor="middle" class="node-title">Materialize and audit configuration</text>
  </g>
  <path d="M295 425 V455" class="flow-violet"/>
  <path d="M295 520 V550" class="flow-violet"/>
  <text x="312" y="444" class="edge-label-violet">combines</text>
  <text x="312" y="539" class="edge-label-violet">materializes</text>

  <rect x="575" y="280" width="590" height="360" rx="24" fill="url(#bluePanel)" stroke="#3d8fc9" stroke-width="1.7"/>
  <text x="605" y="320" class="section">2. Run matched replay</text>
  <g filter="url(#shadow)">
    <rect x="605" y="360" width="250" height="90" rx="15" class="node-blue"/>
    <text x="730" y="391" text-anchor="middle" class="node-title">Candidate</text>
    <text x="730" y="413" text-anchor="middle" class="node-title">AdaptiveHybridAgent</text>
    <text x="730" y="436" text-anchor="middle" class="small">Runs the proposed configuration</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="885" y="360" width="250" height="90" rx="15" class="input"/>
    <text x="1010" y="391" text-anchor="middle" class="node-title">Current control</text>
    <text x="1010" y="413" text-anchor="middle" class="node-title">AdaptiveHybridAgent</text>
    <text x="1010" y="436" text-anchor="middle" class="small">Runs the frozen baseline</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="605" y="500" width="530" height="70" rx="15" class="node-blue"/>
    <text x="870" y="531" text-anchor="middle" class="node-title">Replay both agents fairly</text>
    <text x="870" y="553" text-anchor="middle" class="small">Use the same sessions, folds + fidelity budget</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="605" y="595" width="530" height="45" rx="14" class="node-teal"/>
    <text x="870" y="623" text-anchor="middle" class="node-title">Compute paired metrics + session rewards</text>
  </g>
  <path d="M730 450 V475 H870 V500" class="flow-blue"/>
  <path d="M1010 450 V475 H870 V500" class="flow"/>
  <path d="M870 570 V595" class="flow-teal"/>
  <text x="780" y="468" text-anchor="middle" class="edge-label-blue">replays candidate</text>
  <text x="965" y="492" text-anchor="middle" class="edge-label">replays control</text>
  <text x="888" y="587" class="edge-label-teal">scores</text>

  <rect x="1195" y="280" width="560" height="360" rx="24" fill="url(#violetPanel)" stroke="#725dcc" stroke-width="1.7"/>
  <text x="1225" y="320" class="section">3. Evaluate and search</text>
  <g filter="url(#shadow)">
    <rect x="1225" y="360" width="500" height="60" rx="15" class="node-blue"/>
    <text x="1475" y="397" text-anchor="middle" class="node-title">Measure candidate reward − control reward</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1225" y="450" width="500" height="60" rx="15" class="node-violet"/>
    <text x="1475" y="487" text-anchor="middle" class="node-title">Decide PROMOTE · REJECT · HOLD</text>
  </g>
  <rect x="1225" y="545" width="135" height="60" rx="14" class="node-violet"/>
  <text x="1292" y="582" text-anchor="middle" class="node-title">Screen at F0</text>
  <rect x="1407" y="545" width="135" height="60" rx="14" class="node-violet"/>
  <text x="1474" y="582" text-anchor="middle" class="node-title">Tune at F1</text>
  <rect x="1590" y="545" width="135" height="60" rx="14" class="node-teal"/>
  <text x="1657" y="582" text-anchor="middle" class="node-title">Confirm at F2</text>
  <path d="M1475 420 V450" class="flow-violet"/>
  <path d="M1292 510 V545" class="flow-violet"/>
  <path d="M1360 575 H1407" class="flow-violet"/>
  <path d="M1542 575 H1590" class="flow-teal"/>
  <text x="1492" y="442" class="edge-label-violet">decides</text>
  <text x="1383" y="564" text-anchor="middle" class="edge-label-violet">escalates</text>
  <text x="1566" y="564" text-anchor="middle" class="edge-label-teal">confirms</text>

  <!-- Primary and feedback flows -->
  <path d="M255 232 V255 H295 V360" class="flow-violet"/>
  <path d="M675 232 V255 H1010 V360" class="flow"/>
  <path d="M1095 232 V255 H870 V500" class="flow-blue"/>
  <path d="M1530 232 V255 H1292 V545" class="flow-violet"/>
  <text x="255" y="248" text-anchor="middle" class="edge-label-top">defines search space</text>
  <text x="675" y="248" text-anchor="middle" class="edge-label-top">sets baseline</text>
  <text x="1095" y="248" text-anchor="middle" class="edge-label-top">supplies replay cases</text>
  <text x="1530" y="248" text-anchor="middle" class="edge-label-top">bounds search</text>
  <path d="M515 582 H560 V405 H605" class="flow-blue"/>
  <path d="M1135 617 H1180 V390 H1225" class="flow-teal"/>
  <path d="M1475 510 V525 H1175 V665 H295 V520" class="feedback"/>
  <text x="562" y="394" class="edge-label-blue">instantiates</text>
  <text x="1182" y="378" class="edge-label-teal">compares</text>
  <text x="735" y="686" text-anchor="middle" class="edge-label-violet">recombines survivors + tunes parameters with BOHB</text>

  <!-- Offline result -->
  <path d="M60 715 H1740" class="boundary"/>
  <rect x="755" y="698" width="290" height="34" rx="17" fill="#3a2a17" stroke="#d7a13a"/>
  <text x="806" y="720" class="pill" fill="#fde68a">HUMAN REVIEW FOLLOWS</text>

  <rect x="60" y="750" width="1680" height="62" rx="18" fill="#102a32" stroke="#2f9f95" stroke-width="1.6"/>
  <text x="90" y="789" class="section">Offline result</text>
  <rect x="355" y="760" width="310" height="42" rx="13" class="node-teal"/>
  <text x="510" y="787" text-anchor="middle" class="node-title">Selected CandidateSpec</text>
  <rect x="735" y="760" width="310" height="42" rx="13" class="node-teal"/>
  <text x="890" y="787" text-anchor="middle" class="node-title">F0/F1/F2 evidence</text>
  <rect x="1115" y="760" width="250" height="42" rx="13" class="node-amber"/>
  <text x="1240" y="787" text-anchor="middle" class="node-title">Rejections</text>
  <rect x="1435" y="760" width="270" height="42" rx="13" class="input"/>
  <text x="1570" y="787" text-anchor="middle" class="node-title">Campaign report</text>
  <path d="M1657 605 V690 H510 V760" class="flow-teal"/>
  <path d="M665 781 H735" class="flow-teal"/>
  <path d="M1045 781 H1115" class="flow-teal"/>
  <path d="M1365 781 H1435" class="flow-teal"/>
  <text x="1090" y="680" text-anchor="middle" class="edge-label-teal">packages the offline result for review</text>
  <text x="700" y="771" text-anchor="middle" class="edge-label-teal">attaches</text>
  <text x="1080" y="771" text-anchor="middle" class="edge-label-teal">records</text>
  <text x="1400" y="771" text-anchor="middle" class="edge-label-teal">writes</text>

  <text x="60" y="836" class="small">Complete agents are compared offline · hidden targets remain evaluator-side · campaign results cannot deploy themselves.</text>
  <text x="1510" y="836" class="small">GhostLab proposes · review pins</text>
</svg>
