<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">GhostLab offline workspace — simplified</title>
  <desc id="desc">Simplified GhostLab workflow. Development sessions and the product catalog produce target-safe replay evidence and fitted rankers. The adaptive architecture and frozen control constrain whole-agent candidate construction and matched replay. GhostLab races candidates through F0, F1, BOHB, and F2, packages promotion evidence for human review, and pins one approved configuration for the frozen Adaptive Hybrid runtime.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12233d"/>
    </linearGradient>
    <linearGradient id="dataPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d47"/>
      <stop offset="1" stop-color="#102238"/>
    </linearGradient>
    <linearGradient id="searchPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241f4d"/>
      <stop offset="1" stop-color="#171a39"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9fb3ca"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#55b7ff"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#45d6c0"/>
    </marker>
    <style>
      .title { font: 700 40px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; letter-spacing: -0.6px; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #adbed1; }
      .section { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .node-title { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .node-title-small { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #9fb3ca; }
      .pill { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.75px; }
      .edge-label { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d8e4f0; paint-order: stroke; stroke: #1a1b3d; stroke-width: 7px; stroke-linejoin: round; }
      .edge-label-top { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d8e4f0; paint-order: stroke; stroke: #0b1728; stroke-width: 7px; stroke-linejoin: round; }
      .edge-label-blue { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #8bd3ff; paint-order: stroke; stroke: #102238; stroke-width: 7px; stroke-linejoin: round; }
      .edge-label-violet { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #c4b5fd; paint-order: stroke; stroke: #1a1b3d; stroke-width: 7px; stroke-linejoin: round; }
      .edge-label-teal { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #79ead9; paint-order: stroke; stroke: #102238; stroke-width: 7px; stroke-linejoin: round; }
      .input { fill: #17263a; stroke: #415871; stroke-width: 1.5; }
      .node-blue { fill: #123651; stroke: #419ee0; stroke-width: 1.5; }
      .node-violet { fill: #2a2353; stroke: #8268dc; stroke-width: 1.5; }
      .node-amber { fill: #3a2a17; stroke: #d7a13a; stroke-width: 1.5; }
      .node-teal { fill: #103a3b; stroke: #31bbaa; stroke-width: 1.5; }
      .flow { fill: none; stroke: #9fb3ca; stroke-width: 2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #55b7ff; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .flow-violet { fill: none; stroke: #a78bfa; stroke-width: 2.2; marker-end: url(#arrowViolet); }
      .flow-teal { fill: none; stroke: #45d6c0; stroke-width: 2.2; marker-end: url(#arrowTeal); }
      .boundary { fill: none; stroke: #d7a13a; stroke-width: 1.6; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1800" height="900" fill="url(#background)"/>
  <circle cx="1680" cy="55" r="250" fill="#4f46e5" opacity="0.07"/>
  <circle cx="80" cy="880" r="245" fill="#14b8a6" opacity="0.055"/>

  <text x="60" y="58" class="title">GhostLab offline workspace — simplified</text>
  <text x="60" y="92" class="subtitle">Replay sessions, fit rankers, optimize complete agents, review the evidence, then freeze one approved runtime configuration.</text>
  <rect x="1490" y="40" width="250" height="40" rx="20" fill="#352b65" stroke="#8d76e8"/>
  <text x="1534" y="65" class="pill" fill="#ddd6fe">NO ONLINE LEARNING</text>

  <text x="60" y="137" class="section">Main inputs</text>
  <g filter="url(#shadow)">
    <rect x="60" y="157" width="390" height="78" rx="15" class="input"/>
    <text x="255" y="191" text-anchor="middle" class="node-title">2,200 development sessions</text>
    <text x="255" y="215" text-anchor="middle" class="small">Supply target-safe replay cases</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="480" y="157" width="390" height="78" rx="15" class="input"/>
    <text x="675" y="191" text-anchor="middle" class="node-title">50,000-product catalog</text>
    <text x="675" y="215" text-anchor="middle" class="small">Supplies products and attributes</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="157" width="390" height="78" rx="15" class="input"/>
    <text x="1095" y="187" text-anchor="middle" class="node-title">Adaptive architecture</text>
    <text x="1095" y="207" text-anchor="middle" class="node-title">+ technique catalog</text>
    <text x="1095" y="225" text-anchor="middle" class="small">Constrains legal candidates</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1320" y="157" width="420" height="78" rx="15" class="input"/>
    <text x="1530" y="187" text-anchor="middle" class="node-title">Current adaptive control</text>
    <text x="1530" y="207" text-anchor="middle" class="node-title">+ fitted assets</text>
    <text x="1530" y="225" text-anchor="middle" class="small">Sets the replay baseline</text>
  </g>

  <rect x="45" y="285" width="1710" height="365" rx="26" fill="#171b37" stroke="#725dcc" stroke-width="1.7"/>
  <rect x="70" y="315" width="760" height="300" rx="22" fill="url(#dataPanel)" stroke="#3d8fc9" stroke-width="1.6"/>
  <text x="95" y="353" class="section">A. Replay &amp; ranker fitting</text>

  <g filter="url(#shadow)">
    <rect x="95" y="400" width="160" height="100" rx="15" class="node-blue"/>
    <text x="175" y="441" text-anchor="middle" class="node-title-small">Replay without</text>
    <text x="175" y="463" text-anchor="middle" class="node-title-small">target leakage</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="275" y="400" width="160" height="100" rx="15" class="node-blue"/>
    <text x="355" y="441" text-anchor="middle" class="node-title-small">Capture pools</text>
    <text x="355" y="463" text-anchor="middle" class="node-title-small">+ labels</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="455" y="400" width="160" height="100" rx="15" class="node-blue"/>
    <text x="535" y="441" text-anchor="middle" class="node-title-small">Split into five</text>
    <text x="535" y="463" text-anchor="middle" class="node-title-small">stratified folds</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="635" y="400" width="170" height="100" rx="15" class="node-teal"/>
    <text x="720" y="441" text-anchor="middle" class="node-title-small">Fit rankers</text>
    <text x="720" y="463" text-anchor="middle" class="node-title-small">+ hash assets</text>
  </g>
  <path d="M255 450 H275" class="flow-blue"/>
  <path d="M435 450 H455" class="flow-blue"/>
  <path d="M615 450 H635" class="flow-teal"/>

  <rect x="870" y="315" width="860" height="300" rx="22" fill="url(#searchPanel)" stroke="#725dcc" stroke-width="1.6"/>
  <text x="895" y="353" class="section">B. Whole-agent optimization</text>

  <g filter="url(#shadow)">
    <rect x="895" y="400" width="145" height="100" rx="15" class="node-violet"/>
    <text x="967" y="441" text-anchor="middle" class="node-title-small">Select legal</text>
    <text x="967" y="463" text-anchor="middle" class="node-title-small">techniques</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1060" y="400" width="145" height="100" rx="15" class="node-amber"/>
    <text x="1132" y="441" text-anchor="middle" class="node-title-small">Build valid</text>
    <text x="1132" y="463" text-anchor="middle" class="node-title-small">candidates</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1225" y="400" width="145" height="100" rx="15" class="node-blue"/>
    <text x="1297" y="441" text-anchor="middle" class="node-title-small">Replay candidate</text>
    <text x="1297" y="463" text-anchor="middle" class="node-title-small">against control</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1390" y="400" width="145" height="100" rx="15" class="node-violet"/>
    <text x="1462" y="441" text-anchor="middle" class="node-title-small">Race +</text>
    <text x="1462" y="463" text-anchor="middle" class="node-title-small">optimize</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1555" y="400" width="150" height="100" rx="15" class="node-teal"/>
    <text x="1630" y="441" text-anchor="middle" class="node-title-small">Produce</text>
    <text x="1630" y="463" text-anchor="middle" class="node-title-small">promotion evidence</text>
  </g>
  <path d="M1040 450 H1060" class="flow-violet"/>
  <path d="M1205 450 H1225" class="flow-violet"/>
  <path d="M1370 450 H1390" class="flow-violet"/>
  <path d="M1535 450 H1555" class="flow-teal"/>

  <rect x="1015" y="535" width="570" height="50" rx="14" fill="#211d43" stroke="#594a9e"/>
  <text x="1300" y="566" text-anchor="middle" class="node-title-small">Escalate F0 → F1 → F2 · recombine candidates · tune with BOHB</text>
  <path d="M1462 500 V535" class="flow-violet"/>
  <path d="M1015 560 H980 V520 H1132 V500" class="flow-violet" stroke-dasharray="7 7"/>

  <path d="M255 235 V265 H175 V400" class="flow"/>
  <path d="M675 235 V265 H355 V400" class="flow"/>
  <path d="M1095 235 V265 H967 V400" class="flow-violet"/>
  <path d="M1530 235 V265 H1297 V400" class="flow-violet"/>
  <path d="M805 450 H850 V380 H1132 V400" class="flow-teal"/>
  <text x="215" y="257" text-anchor="middle" class="edge-label-top">supplies cases</text>
  <text x="515" y="257" text-anchor="middle" class="edge-label-top">supplies products</text>
  <text x="1030" y="257" text-anchor="middle" class="edge-label-top">constrains search</text>
  <text x="1410" y="257" text-anchor="middle" class="edge-label-top">sets baseline</text>
  <text x="965" y="372" text-anchor="middle" class="edge-label-teal">adds fitted rankers to candidate construction</text>

  <path d="M60 695 H1740" class="boundary"/>
  <rect x="750" y="678" width="300" height="34" rx="17" fill="#3a2a17" stroke="#d7a13a"/>
  <text x="796" y="700" class="pill" fill="#fde68a">HUMAN REVIEW BOUNDARY</text>

  <rect x="60" y="735" width="1680" height="100" rx="21" fill="#102a32" stroke="#2f9f95" stroke-width="1.6"/>
  <text x="90" y="794" class="section">GhostLab output</text>
  <rect x="360" y="758" width="285" height="55" rx="14" class="node-teal"/>
  <text x="502" y="792" text-anchor="middle" class="node-title">Propose winner + evidence</text>
  <rect x="705" y="758" width="250" height="55" rx="14" class="node-amber"/>
  <text x="830" y="792" text-anchor="middle" class="node-title">Review the evidence</text>
  <rect x="1015" y="758" width="285" height="55" rx="14" class="node-teal"/>
  <text x="1157" y="792" text-anchor="middle" class="node-title">Pin approved configuration</text>
  <rect x="1360" y="758" width="320" height="55" rx="14" class="input"/>
  <text x="1520" y="781" text-anchor="middle" class="node-title">AdaptiveHybridAgent</text>
  <text x="1520" y="802" text-anchor="middle" class="small">Runs frozen configuration + models</text>
  <path d="M1630 500 V675 H502 V758" class="flow-teal"/>
  <path d="M645 785 H705" class="flow-teal"/>
  <path d="M955 785 H1015" class="flow-teal"/>
  <path d="M1300 785 H1360" class="flow-teal"/>
  <text x="1070" y="665" text-anchor="middle" class="edge-label-teal">packages candidate evidence for human review</text>
  <text x="675" y="775" text-anchor="middle" class="edge-label-teal">submits</text>
  <text x="985" y="775" text-anchor="middle" class="edge-label-teal">approves</text>
  <text x="1330" y="775" text-anchor="middle" class="edge-label-teal">loads</text>

  <text x="60" y="875" class="small">Targets stay offline · private F3 stays sealed · GhostLab cannot deploy itself · runtime does not update model weights.</text>
  <text x="1515" y="875" class="small">GhostLab proposes · review pins</text>
</svg>
