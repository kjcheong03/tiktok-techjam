[project]
name = "ghostlab-baselines"
version = "0.1.0"
description = "Reproducible retrieval and conversation-state baselines for TechJam Track 4"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.7,<2",
  "sentence-transformers>=6,<7",
]

[tool.ruff]
extend-exclude = [
  "README.md",
  "docs",
  "baseline/official_reference.py",
  "evaluator",
  "tests/test_evaluator.py",
]

[tool.uv]
package = false
