<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Visualize and compare GhostLab evaluation results." />
    <title>GhostLab Dashboard</title>
    <link rel="stylesheet" href="/dashboard/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <header class="site-header">
      <a class="brand" href="/dashboard/" aria-label="GhostLab dashboard home">
        <strong>GhostLab</strong>
      </a>
      <div class="header-actions">
        <button class="button button-secondary" id="upload-button" type="button">Import JSON</button>
        <input id="file-input" type="file" accept="application/json,.json" multiple hidden />
      </div>
    </header>

    <main>
      <div id="dashboard-content" hidden>
        <section class="section-block leaderboard-section">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Leaderboard</p>
              <h2>System comparison</h2>
            </div>
            <span class="muted">Higher is better, except MTTC</span>
          </div>
          <div class="comparison-head comparison-grid" aria-hidden="true">
            <span>System</span><span>Technical score</span><span>Hit@10</span><span>MRR</span><span>Normalized efficiency</span><span>MTTC</span>
          </div>
          <div id="comparison-chart" class="comparison-chart"></div>
        </section>

        <section class="section-block overview-section">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Selected system</p>
              <h2 id="selected-run-name">—</h2>
            </div>
            <p id="selected-run-source" class="source-label">—</p>
          </div>
          <div class="metric-grid" id="metric-grid"></div>
        </section>

        <section class="split-layout">
          <article class="section-block">
            <div class="section-heading compact-heading">
              <div>
                <p class="eyebrow">Behavior slices</p>
                <h2>Scenario performance</h2>
              </div>
              <select id="scenario-metric" class="small-select" aria-label="Scenario chart metric">
                <option value="recommended_technical_score">Technical score</option>
                <option value="hit_rate_at_10">Hit Rate@10</option>
                <option value="mrr">MRR</option>
                <option value="mttc">MTTC</option>
              </select>
            </div>
            <div id="scenario-chart" class="scenario-chart"></div>
          </article>

          <article class="section-block">
            <div class="section-heading compact-heading">
              <div>
                <p class="eyebrow">Outcome shape</p>
                <h2>Rank distribution</h2>
              </div>
              <span class="muted" id="distribution-label">Best rank</span>
            </div>
            <div id="rank-chart" class="rank-chart"></div>
          </article>
        </section>

      </div>
    </main>

    <div class="drop-overlay" id="drop-overlay" hidden>
      <div><strong>Drop result JSON here</strong><span>Multiple files are supported</span></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/dashboard/app.js" defer></script>
  </body>
</html>
